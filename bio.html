<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hồ sơ mật – Phạm Xuân Ẩn đến 1957</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Noto+Sans+JP:wght@400;500;700&family=Courier+Prime:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0e1f25;
      --panel: #16303a;
      --line: #2d4a54;
      --gold: #ebcb45;
      --gold2: #f6d77e;
      --paper: #eef1f2;
      --ink: #1a1d21;
      --red: #c23838;
      --text: #dce7e6;
      --mute: #8fa7ae;
      --acc: #8fc1d4;
      --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
      --sans: "Be Vietnam Pro", "Noto Sans JP", system-ui, -apple-system, sans-serif;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased
    }

    .mono {
      font-family: 'Courier Prime', 'Courier New', monospace
    }

    header {
      text-align: center;
      padding: 70px 5vw 36px
    }

    header small {
      color: var(--gold);
      letter-spacing: .2em;
      font-size: 12px;
      font-weight: 600
    }

    header h1 {
      font-family: var(--serif);
      margin: 10px 0 6px;
      font-size: clamp(30px, 5vw, 48px);
      color: var(--gold2);
      font-weight: 600
    }

    header p {
      margin: 0 auto;
      max-width: 520px;
      color: var(--mute);
      font-size: 14.5px
    }

    .dossier {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 5vw 40px
    }

    .page {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 12px + min(var(--i), 3)*34px);
      margin-bottom: 30vh;
      background: var(--paper);
      color: var(--ink);
      border-radius: 4px 4px 6px 6px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, .55);
      padding-bottom: 26px
    }

    .tab {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 34px;
      padding: 0 20px;
      border-bottom: 1px solid #b9c3c8;
      font-size: 12px;
      letter-spacing: .1em
    }

    .tab b {
      color: var(--red)
    }

    .body {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 28px;
      padding: 22px 26px 0
    }

    .body h2 {
      font-family: var(--serif);
      margin: 0 0 10px;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.25;
      color: var(--ink);
      font-weight: 600
    }

    .body p {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.65
    }

    .red {
      color: inherit;
      background: transparent;
      font-weight: inherit;
      padding: 0;
      transition: none
    }

    .page.on .red {
      background: transparent;
      color: inherit;
      font-weight: inherit
    }

    .pin {
      position: relative;
      align-self: start;
      aspect-ratio: 3/4;
      background: repeating-linear-gradient(135deg, #dde3e6 0 12px, #d2dbe0 12px 24px);
      border: 6px solid #f7f9fa;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 12px;
      color: #5b6770;
      padding: 14px;
      transform: rotate(2.5deg);
      transition: transform .8s;
      font-family: var(--sans)
    }

    .page:nth-child(even) .pin {
      transform: rotate(-2.5deg)
    }

    .page.on .pin {
      transform: rotate(0)
    }

    .pin::before {
      content: "";
      position: absolute;
      top: -22px;
      left: 50%;
      width: 16px;
      height: 44px;
      border: 3px solid #8a8d92;
      border-radius: 10px;
      transform: translateX(-50%) rotate(8deg);
      z-index: 2
    }

    .stamp {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      border: 2.5px solid var(--red);
      color: var(--red);
      padding: 3px 10px;
      font-weight: 700;
      font-size: 11.5px;
      letter-spacing: .14em;
      transform: rotate(-6deg);
      border-radius: 3px;
      background: rgba(238, 241, 242, .95);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
      user-select: none;
      pointer-events: none;
      white-space: nowrap
    }

    .next {
      text-align: center;
      padding: 10px 5vw 90px
    }

    .next .yr {
      font-size: clamp(42px, 9vw, 84px);
      font-family: var(--serif);
      color: var(--gold2);
      font-weight: 700
    }

    .next p {
      color: var(--mute);
      margin: 0;
      font-size: 15px
    }

    .next a {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 34px;
      background: linear-gradient(135deg, #ebcb45 0%, #d4ad22 100%);
      color: #12181b;
      text-decoration: none;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: .06em;
      border-radius: 999px;
      transition: all .25s ease;
      box-shadow: 0 8px 25px rgba(235, 203, 69, .35);
      font-family: var(--sans)
    }

    .next a:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(235, 203, 69, .55);
      filter: brightness(1.06)
    }

    /* Nút quay lại Bối cảnh lịch sử */
    .btn-back-context {
      position: fixed;
      top: 16px;
      left: 20px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: rgba(14, 31, 37, 0.9);
      border: 1px solid rgba(143, 193, 212, 0.45);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: .06em;
      font-weight: 600;
      backdrop-filter: blur(6px);
      transition: all .2s ease;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
      font-family: var(--sans)
    }

    .btn-back-context:hover {
      border-color: var(--gold);
      color: #fff;
      background: rgba(18, 38, 46, 0.98);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .6)
    }

    /* Bộ chuyển đổi ngôn ngữ Việt - Nhật đồng bộ */
    .lang-switcher {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 120;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      background: rgba(14, 31, 37, 0.9);
      border: 1.5px solid rgba(143, 193, 212, 0.35);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
      transition: border-color .2s, transform .2s
    }

    .lang-switcher:hover {
      border-color: var(--gold);
      transform: translateY(-1px)
    }

    .lang-btn {
      background: transparent;
      border: 0;
      color: var(--mute);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: .03em;
      transition: all .2s ease
    }

    .lang-btn:hover {
      color: #fff
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #ebcb45 0%, #d4ad22 100%);
      color: #12181b;
      box-shadow: 0 2px 8px rgba(235, 203, 69, .35)
    }

    .lang-divider {
      color: rgba(255, 255, 255, 0.2);
      font-size: 11px;
      user-select: none
    }

    @media(max-width:640px) {
      .body {
        grid-template-columns: 1fr;
        padding: 18px 16px 0
      }

      .pin {
        max-width: 160px;
        margin: 10px auto 0
      }

      .body p {
        font-size: 14px
      }

      .stamp {
        top: 8px;
        right: 8px;
        font-size: 10.5px;
        padding: 2px 8px
      }
    }
  </style>
</head>

              'タック医師の説得を受けた彼はこれを受諾、対米研究を専門とする第1期戦略諜報幹部の一員となった。',
              '1953年、ウーミンの密林において、当時南部党委員会常務であったレ・ドゥク・トの主宰のもと、共産党への入党を果たした。'
            ],
            pin: '[写真: 戦区D<br>またはウーミンの森]'
          },
          {
            tabLabel: 'ページ 06',
            period: '1954 – 1955',
            stamp: '極秘ファイル',
            title: '深部潜入',
            paragraphs: [
              '1954年、南ベトナム当局により徴兵される。フランス連合軍総司令部の心理戦部書記を務める中で、米特別軍事顧問団長であり実質的なインドシナCIA責任者であったエドワード・レンズデール大佐と親交を結ぶ。',
              '1955年、卓越した英語力を買われ、CATOおよびTRIM軍事使節団の連絡将校となり、米顧問向けのコマンドー訓練資料や作戦計画の翻訳を直接担当した。'
            ],
            pin: '[写真: サイゴンの<br>エドワード・レンズデール]'
          },
          {
            tabLabel: 'ページ 07',
            period: '1956 – 1957',
            stamp: '極秘ファイル',
            title: '米国への切符',
            paragraphs: [
              '1956年、留学のため除隊を申し出る。レンズデールは即座に同意し、推薦状を執筆して奨学金の手配を行った。',
              '<blockquote>「素晴らしい。君が軍事であれ民事であれ、米国で学びたいのであれば大賛成だ。全面的に支援しよう。」</blockquote>',
              '<p style="margin-top:12px">1957年、ジャーナリズムを学ぶため米国へと旅立ち、以後の生涯を支える「記者」という偽装の幕を開けた。</p>'
            ],
            pin: '[写真: ファム・スアン・アン<br>渡米（1957年）]'
          }
        ]
      }
    };

    let ioInstance = null;

    function renderDossier() {
      const lang = (window.getCurrentLang ? window.getCurrentLang() : 'vi') || 'vi';
      const data = DOSSIER_DATA[lang] || DOSSIER_DATA.vi;
      const m = data.meta;

      document.title = m.pageTitle;
      document.getElementById('btnBackContext').textContent = m.backBtn;
      document.getElementById('btnBackContext').title = m.backTitle;
      document.getElementById('hdrBadge').textContent = m.hdrBadge;
      document.getElementById('hdrTitle').textContent = m.hdrTitle;
      document.getElementById('hdrDesc').textContent = m.hdrDesc;
      document.getElementById('nextSubtitle').textContent = m.nextSubtitle;
      document.getElementById('nextDesc').textContent = m.nextDesc;
      document.getElementById('nextBtn').textContent = m.nextBtn;

      const container = document.getElementById('dossierContainer');
      let html = '';

      data.pages.forEach((p, idx) => {
        let pContent = '';
        p.paragraphs.forEach(pg => {
          if (pg.startsWith('<blockquote>') || pg.startsWith('<p')) {
            pContent += pg;
          } else {
            pContent += `<p>${pg}</p>`;
          }
        });

        html += `
      <article class="page" style="--i:${idx}" data-idx="${idx}">
        <div class="tab mono"><b>${p.tabLabel}</b><span>${p.period}</span></div>
        <div class="body">
          <div>
            <h2>${p.title}</h2>
            ${pContent}
          </div>
          <div class="pin">
            <div class="stamp mono">${p.stamp}</div>
            <span>${p.pin}</span>
          </div>
        </div>
      </article>
    `;
      });
      container.innerHTML = html;

      if (ioInstance) {
        ioInstance.disconnect();
      }

      ioInstance = new IntersectionObserver(es => {
        es.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('on');
          }
        });
      }, { rootMargin: '-30% 0px -30% 0px' });

      document.querySelectorAll('.page').forEach(p => ioInstance.observe(p));
    }

    // Lắng nghe sự kiện chuyển đổi ngôn ngữ
    window.addEventListener('languagechange', () => {
      renderDossier();
    });

    // Khởi chạy khi tải trang
    renderDossier();
  </script>
</body>
