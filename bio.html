<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hồ sơ mật – Phạm Xuân Ẩn đến 1957</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Noto+Sans+JP:wght@400;500;700&family=Courier+Prime:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0e1f25;
      --panel: #16303a;
      --line: #2d4a54;
      --gold: #ebcb45;
      --gold2: #f6d77e;
      --paper: #eef1f2;
      --ink: #1a1d21;
      --red: #c23838;
      --text: #dce7e6;
      --mute: #8fa7ae;
      --acc: #8fc1d4;
      --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
      --sans: "Be Vietnam Pro", "Noto Sans JP", system-ui, -apple-system, sans-serif;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased
    }

    .mono {
      font-family: 'Courier Prime', 'Courier New', monospace
    }

    header {
      text-align: center;
      padding: 70px 5vw 36px
    }

    header small {
      color: var(--gold);
      letter-spacing: .2em;
      font-size: 12px;
      font-weight: 600
    }

    header h1 {
      font-family: var(--serif);
      margin: 10px 0 6px;
      font-size: clamp(30px, 5vw, 48px);
      color: var(--gold2);
      font-weight: 600
    }

    header p {
      margin: 0 auto;
      max-width: 520px;
      color: var(--mute);
      font-size: 14.5px
    }

    .dossier {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 5vw 40px
    }

    .page {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 12px + min(var(--i), 3)*34px);
      margin-bottom: 30vh;
      background: var(--paper);
      color: var(--ink);
      border-radius: 4px 4px 6px 6px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, .55);
      padding-bottom: 26px
    }

    .tab {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 34px;
      padding: 0 20px;
      border-bottom: 1px solid #b9c3c8;
      font-size: 12px;
      letter-spacing: .1em
    }

    .tab b {
      color: var(--red)
    }

    .body {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 28px;
      padding: 22px 26px 0
    }

    .body h2 {
      font-family: var(--serif);
      margin: 0 0 10px;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.25;
      color: var(--ink);
      font-weight: 600
    }

    .body p {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.65
    }

    .red {
      color: inherit;
      background: transparent;
      font-weight: inherit;
      padding: 0;
      transition: none
    }

    .page.on .red {
      background: transparent;
      color: inherit;
      font-weight: inherit
    }

    .pin {
      position: relative;
      align-self: start;
      margin: 0;
      background: #142830;
      border: 6px solid #f7f9fa;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .32);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: rotate(2.5deg);
      transition: transform .8s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .3s ease;
      font-family: var(--sans);
      width: 100%;
      max-width: 380px;
    }

    .page:nth-child(even) .pin {
      transform: rotate(-2.5deg)
    }

    .page.on .pin {
      transform: rotate(0)
    }

    .pin:hover {
      box-shadow: 0 12px 32px rgba(0, 0, 0, .42)
    }


    .pin-media {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: repeating-linear-gradient(135deg, rgba(22, 48, 58, 0.7) 0 14px, #0e1f25 14px 28px);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .pin-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease, filter .3s ease
    }

    .pin:hover .pin-img {
      transform: scale(1.025);
      filter: brightness(1.04)
    }

    .pin-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 12.5px;
      color: #8fa7ae;
      padding: 16px;
      line-height: 1.5;
      font-family: var(--sans)
    }

    .stamp {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 8;
      border: 2px solid var(--red);
      color: var(--red);
      padding: 3px 9px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .14em;
      transform: rotate(-6deg);
      border-radius: 3px;
      background: rgba(238, 241, 242, .96);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
      user-select: none;
      pointer-events: none;
      white-space: nowrap
    }

    /* Chú thích dưới ảnh đồng bộ chuẩn timeline */
    .pin-caption {
      padding: 10px 14px;
      font-size: 12.5px;
      line-height: 1.45;
      font-style: italic;
      color: #b5c7cd;
      background: rgba(14, 31, 37, 0.96);
      border-top: 1px solid rgba(143, 193, 212, 0.25);
      font-family: var(--serif);
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 7px
    }

    .pin-caption-icon {
      color: var(--gold);
      font-style: normal;
      font-size: 11px;
      line-height: 1.45;
      flex-shrink: 0;
      margin-top: 1px
    }

    .pin-caption-text {
      flex: 1
    }

    .next {
      text-align: center;
      padding: 10px 5vw 90px
    }

    .next .yr {
      font-size: clamp(42px, 9vw, 84px);
      font-family: var(--serif);
      color: var(--gold2);
      font-weight: 700
    }

    .next p {
      color: var(--mute);
      margin: 0;
      font-size: 15px
    }

    .next a {
      display: inline-block;
      margin-top: 22px;
      padding: 14px 34px;
      background: linear-gradient(135deg, #ebcb45 0%, #d4ad22 100%);
      color: #12181b;
      text-decoration: none;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: .06em;
      border-radius: 999px;
      transition: all .25s ease;
      box-shadow: 0 8px 25px rgba(235, 203, 69, .35);
      font-family: var(--sans)
    }

    .next a:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(235, 203, 69, .55);
      filter: brightness(1.06)
    }

    /* Nút quay lại Bối cảnh lịch sử */
    .btn-back-context {
      position: fixed;
      top: 16px;
      left: 20px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: rgba(14, 31, 37, 0.9);
      border: 1px solid rgba(143, 193, 212, 0.45);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: .06em;
      font-weight: 600;
      backdrop-filter: blur(6px);
      transition: all .2s ease;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
      font-family: var(--sans)
    }

    .btn-back-context:hover {
      border-color: var(--gold);
      color: #fff;
      background: rgba(18, 38, 46, 0.98);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .6)
    }

    /* Bộ chuyển đổi ngôn ngữ Việt - Nhật đồng bộ */
    .lang-switcher {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 120;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      background: rgba(14, 31, 37, 0.9);
      border: 1.5px solid rgba(143, 193, 212, 0.35);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
      transition: border-color .2s, transform .2s
    }

    .lang-switcher:hover {
      border-color: var(--gold);
      transform: translateY(-1px)
    }

    .lang-btn {
      background: transparent;
      border: 0;
      color: var(--mute);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: .03em;
      transition: all .2s ease
    }

    .lang-btn:hover {
      color: #fff
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #ebcb45 0%, #d4ad22 100%);
      color: #12181b;
      box-shadow: 0 2px 8px rgba(235, 203, 69, .35)
    }

    .lang-divider {
      color: rgba(255, 255, 255, 0.2);
      font-size: 11px;
      user-select: none
    }

    @media(max-width:640px) {
      .body {
        grid-template-columns: 1fr;
        padding: 18px 16px 0
      }

      .pin {
        max-width: 320px;
        margin: 14px auto 0
      }

      .body p {
        font-size: 14px
      }

      .stamp {
        top: 8px;
        right: 8px;
        font-size: 10.5px;
        padding: 2px 8px
      }
    }
  </style>
</head>

<body>

  <!-- Nút quay lại Bối cảnh lịch sử -->

  <!-- Bộ chọn đa ngôn ngữ nổi VI / JA -->
  <nav class="lang-switcher" aria-label="Chọn ngôn ngữ / 言語選択">
    <button type="button" class="lang-btn active" data-lang="vi" title="Chuyển sang Tiếng Việt">VI</button>

  <header>

  </header>

  <main class="dossier" id="dossierContainer"></main>

  <section class="next">

    <p id="nextDesc">Từ đây, hai cuộc đời chạy song song.</p>
    <a href="index.html#timeline" id="nextBtn">XEM DÒNG THỜI GIAN 1957 – 1976</a>
  </section>

    let ioInstance = null;

    function renderDossier() {
      const lang = (window.getCurrentLang ? window.getCurrentLang() : 'vi') || 'vi';
      const data = DOSSIER_DATA[lang] || DOSSIER_DATA.vi;
      const m = data.meta;

      document.title = m.pageTitle;
      document.getElementById('btnBackContext').textContent = m.backBtn;
      document.getElementById('btnBackContext').title = m.backTitle;
      document.getElementById('hdrBadge').textContent = m.hdrBadge;
      document.getElementById('hdrTitle').textContent = m.hdrTitle;
      document.getElementById('hdrDesc').textContent = m.hdrDesc;
      document.getElementById('nextSubtitle').textContent = m.nextSubtitle;
      document.getElementById('nextDesc').textContent = m.nextDesc;
      document.getElementById('nextBtn').textContent = m.nextBtn;

      const container = document.getElementById('dossierContainer');
      let html = '';

      data.pages.forEach((p, idx) => {
        let pContent = '';
        p.paragraphs.forEach(pg => {
          if (pg.startsWith('<blockquote>') || pg.startsWith('<p')) {
            pContent += pg;
          } else {
            pContent += `<p>${pg}</p>`;
          }
        });

        const imgSrc = p.img || p.image || '';
        const captionText = p.caption || '';
        const placeholderText = p.placeholder || p.pin || '[Ảnh tư liệu]';

        let mediaHtml = '';
        if (imgSrc) {
          mediaHtml = `
            <img src="${imgSrc}" alt="${captionText.replace(/"/g, '&quot;')}" class="pin-img" loading="lazy" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='grid';" />
            <div class="pin-placeholder" style="display:none"><span>${placeholderText}</span></div>
          `;
        } else {
          mediaHtml = `<div class="pin-placeholder"><span>${placeholderText}</span></div>`;
        }

        let captionHtml = '';
        if (captionText) {
          captionHtml = `
            <figcaption class="pin-caption">
              <span class="pin-caption-icon">◆</span>
              <span class="pin-caption-text">${captionText}</span>
            </figcaption>
          `;
        }

        html += `
      <article class="page" style="--i:${idx}" data-idx="${idx}">
        <div class="tab mono"><b>${p.tabLabel}</b><span>${p.period}</span></div>
        <div class="body">
          <div>
            <h2>${p.title}</h2>
            ${pContent}
          </div>
          <figure class="pin">
            <div class="pin-media">
              ${mediaHtml}
            </div>
            ${captionHtml}
          </figure>
        </div>
      </article>
    `;
      });
      container.innerHTML = html;

      if (ioInstance) {
        ioInstance.disconnect();
      }

      ioInstance = new IntersectionObserver(es => {
        es.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('on');
          }
        });
      }, { rootMargin: '-30% 0px -30% 0px' });

      document.querySelectorAll('.page').forEach(p => ioInstance.observe(p));
    }

    // Lắng nghe sự kiện chuyển đổi ngôn ngữ
    window.addEventListener('languagechange', () => {
      renderDossier();
    });

    // Khởi chạy khi tải trang
    renderDossier();
  </script>
